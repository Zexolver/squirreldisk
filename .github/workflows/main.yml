name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            asset_name: squirreldisk-linux-x86_64
            bin_name: squirreldisk
          - platform: macos-latest
            asset_name: squirreldisk-macos
            bin_name: squirreldisk
          - platform: windows-latest
            asset_name: squirreldisk-windows-x86_64
            bin_name: squirreldisk.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package artifact (unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin_name }} dist/
          cp -r icons dist/
          cd dist && tar czf ../${{ matrix.asset_name }}.tar.gz .

      - name: Package artifact (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/${{ matrix.bin_name }} dist/
          Copy-Item -Recurse icons dist/icons
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
          if-no-files-found: ignore

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
