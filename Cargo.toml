[package]
name = "squirreldisk"
version = "0.4.0"
description = "A cross-platform disk usage visualizer, built with Rust and Slint"
authors = ["SquirrelDisk contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "squirreldisk"
path = "src/main.rs"

[dependencies]
slint = "1.8"
sysinfo = "0.32"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[build-dependencies]
slint-build = "1.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
